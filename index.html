<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAI - AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 65px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #10a37f;
        }

        .status {
            margin-left: 12px;
            color: #777;
            font-size: 14px;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 90px 20px 120px;
        }

        .chat {
            max-width: 850px;
            margin: auto;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #333;
            color: white;
        }

        .kai-avatar {
            background: #10a37f;
            color: white;
        }

        .message-content {
            flex: 1;
            font-size: 16px;
            color: #222;
        }

        .message-content h3 {
            margin-bottom: 8px;
            font-size: 19px;
        }

        .message-content strong {
            font-weight: bold;
        }

        .message-content ul {
            margin: 8px 0 8px 22px;
        }

        .message-content li {
            margin-bottom: 5px;
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 100px 20px 40px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #666;
            font-size: 17px;
        }

        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #f7f7f8 25%);
            padding: 20px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: white;
            border: 1px solid #ccc;
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            padding: 10px;
            min-height: 45px;
            max-height: 150px;
        }

        #sendBtn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 10px;
            background: #10a37f;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #0d8f70;
        }

        #sendBtn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header {
                padding: 0 15px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .chat-container {
                padding-left: 12px;
                padding-right: 12px;
            }

            .input-area {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">KAI</div>
        <div class="status">AI Assistant</div>
    </header>


    <!-- CHAT -->
    <main class="chat-container" id="chatContainer">

        <div class="chat" id="chat">

            <!-- Welcome Message -->
            <div class="welcome" id="welcome">
                <h1>How can I help you?</h1>
                <p>Ask KAI anything about coding, technology, study, or general questions.</p>
            </div>

        </div>

    </main>


    <!-- INPUT -->
    <div class="input-area">
        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Message KAI..."
                rows="1"
            ></textarea>

            <button id="sendBtn" onclick="sendMessage()">
                ➤
            </button>

        </div>
    </div>


    <script>

        const input = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const chat = document.getElementById("chat");
        const chatContainer = document.getElementById("chatContainer");


        // Send message when pressing Enter
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }

        });


        // Automatically increase textarea height
        input.addEventListener("input", function() {

            this.style.height = "auto";
            this.style.height = this.scrollHeight + "px";

        });


        function addUserMessage(message) {

            const div = document.createElement("div");

            div.className = "message";

            div.innerHTML = `
                <div class="avatar user-avatar">U</div>

                <div class="message-content">
                    ${escapeHTML(message).replace(/\n/g, "<br>")}
                </div>
            `;

            chat.appendChild(div);

            scrollToBottom();
        }


        function addKaiMessage(message) {

            const div = document.createElement("div");

            div.className = "message";

            div.innerHTML = `
                <div class="avatar kai-avatar">K</div>

                <div class="message-content">
                    ${formatResponse(message)}
                </div>
            `;

            chat.appendChild(div);

            scrollToBottom();
        }


        function addTyping() {

            const div = document.createElement("div");

            div.className = "message";
            div.id = "typing";

            div.innerHTML = `
                <div class="avatar kai-avatar">K</div>

                <div class="message-content typing">
                    KAI is thinking...
                </div>
            `;

            chat.appendChild(div);

            scrollToBottom();
        }


        function removeTyping() {

            const typing = document.getElementById("typing");

            if (typing) {
                typing.remove();
            }

        }


        function scrollToBottom() {

            chatContainer.scrollTop = chatContainer.scrollHeight;

        }


        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // Formats KAI's answer
        function formatResponse(text) {

            let html = escapeHTML(text);

            // Bold text: **text**
            html = html.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );

            // Headings: # Heading
            html = html.replace(
                /^### (.*)$/gm,
                "<h3>$1</h3>"
            );

            html = html.replace(
                /^## (.*)$/gm,
                "<h3>$1</h3>"
            );

            html = html.replace(
                /^# (.*)$/gm,
                "<h3>$1</h3>"
            );

            // Bullet points
            html = html.replace(
                /^- (.*)$/gm,
                "<li>$1</li>"
            );

            html = html.replace(
                /(<li>.*<\/li>)/gs,
                "<ul>$1</ul>"
            );

            // New lines
            html = html.replace(/\n/g, "<br>");

            return html;

        }


        async function sendMessage() {

            const message = input.value.trim();

            if (!message) return;

            // Remove welcome screen
            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }

            // Show user message
            addUserMessage(message);

            input.value = "";
            input.style.height = "45px";

            sendBtn.disabled = true;

            // Show typing
            addTyping();


            try {

                /*
                 * CONNECT YOUR AI BACKEND HERE
                 *
                 * Example:
                 *
                 * const response = await fetch("/api/chat", {
                 *     method: "POST",
                 *     headers: {
                 *         "Content-Type": "application/json"
                 *     },
                 *     body: JSON.stringify({
                 *         message: message
                 *     })
                 * });
                 *
                 * const data = await response.json();
                 *
                 * removeTyping();
                 * addKaiMessage(data.reply);
                 */


                // Temporary demo response
                await new Promise(resolve => setTimeout(resolve, 1000));

                removeTyping();

                addKaiMessage(
`## Answer

Thanks for asking! I am **KAI**, your AI assistant.

### Key Points

- I can answer questions.
- I can explain coding problems.
- I can help with HTML, CSS and JavaScript.
- I can explain difficult topics step by step.
- I can provide examples and solutions.

**Connect an AI API/backend to this HTML file to make KAI generate real answers.**`
                );

            }

            catch (error) {

                removeTyping();

                addKaiMessage(
                    "## Error\n\nSorry, something went wrong. Please try again."
                );

                console.error(error);

            }

            finally {

                sendBtn.disabled = false;
                input.focus();

            }

        }

    </script>

</body>
</html>
