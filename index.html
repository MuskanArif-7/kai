<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAI - AI Chatbot</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chatbot">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                K
            </div>

            <div class="header-text">
                <h1>KAI</h1>
                <p>Your AI Assistant</p>
            </div>

            <div class="online">
                <span></span>
                Online
            </div>

        </header>


        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">

            <!-- Welcome -->
            <div class="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h2>Hi, I'm KAI</h2>

                <p>
                    Your simple and intelligent AI assistant.
                    What can I help you with today?
                </p>

            </div>


            <!-- Bot Message -->
            <div class="message bot">

                <div class="avatar">
                    K
                </div>

                <div class="bubble">
                    Hello! 👋
                    <br>
                    I'm KAI. Ask me anything.
                </div>

            </div>


            <!-- User Message -->
            <div class="message user">

                <div class="bubble">
                    Hello KAI!
                </div>

            </div>

        </main>


        <!-- Quick Questions -->
        <div class="quick-buttons">

            <button onclick="sendQuickMessage('Tell me an interesting fact')">
                Interesting fact
            </button>

            <button onclick="sendQuickMessage('Help me with coding')">
                Help with coding
            </button>

            <button onclick="sendQuickMessage('Give me an idea')">
                Give me an idea
            </button>

        </div>


        <!-- Input -->
        <form class="input-area" id="chatForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask KAI anything..."
                autocomplete="off"
            >

            <button type="submit" class="send-button">
                ↑
            </button>

        </form>


        <!-- Footer -->
        <p class="footer">
            KAI may occasionally make mistakes. Please verify important information.
        </p>

    </div>


    <!-- Simple JavaScript -->
    <script>

        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const chatArea = document.getElementById("chatArea");


        // Send message
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            setTimeout(function() {

                addMessage(
                    getResponse(message),
                    "bot"
                );

            }, 600);

        });


        // Add message
        function addMessage(text, type) {

            const message = document.createElement("div");

            message.classList.add(
                "message",
                type
            );


            if (type === "bot") {

                message.innerHTML = `
                    <div class="avatar">K</div>

                    <div class="bubble">
                        ${text}
                    </div>
                `;

            } else {

                message.innerHTML = `
                    <div class="bubble">
                        ${text}
                    </div>
                `;

            }


            chatArea.appendChild(message);

            chatArea.scrollTop =
                chatArea.scrollHeight;
        }


        // Quick buttons
        function sendQuickMessage(text) {

            addMessage(text, "user");

            setTimeout(function() {

                addMessage(
                    getResponse(text),
                    "bot"
                );

            }, 600);

        }


        // Simple responses
        function getResponse(message) {

            message = message.toLowerCase();


            if (
                message.includes("hello") ||
                message.includes("hi")
            ) {

                return "Hello! 👋 Nice to meet you.";

            }


            if (
                message.includes("coding") ||
                message.includes("code")
            ) {

                return "Sure! 💻 Tell me what you are trying to build and I'll help you.";

            }


            if (
                message.includes("idea")
            ) {

                return "Here's an idea: build a personal productivity dashboard with tasks, notes and an AI assistant.";

            }


            if (
                message.includes("fact")
            ) {

                return "Did you know? Honey never spoils. Archaeologists have found edible honey in ancient Egyptian tombs.";

            }


            return "That's interesting! Tell me more and I'll try my best to help. 😊";

        }

    </script>

</body>

</html>
