```html
<!DOCTYPE html>
<html>
<head>
    <title>My Chatbot</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
        }

        .chat {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .input {
            display: flex;
            gap: 5px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .send { background: #333; color: white; }
    </style>
</head>

<body>

<div class="chat">
    <h1>🤖 My Chatbot</h1>

    <div id="messages">
        <h3>Welcome!</h3>
        <p>• Ask me anything.<br>• I will answer in simple points.</p>
    </div>

    <div class="input">
        <button onclick="voice()">🎤</button>
        <button onclick="file()">📎</button>
        <input id="msg" placeholder="Type your message...">
        <button class="send" onclick="send()">Send</button>
    </div>
</div>

<script>
function send() {
    let text = document.getElementById("msg").value;
    if (!text) return;

    document.getElementById("messages").innerHTML +=
        "<h3>You</h3><p>• " + text + "</p>" +
        "<h3>🤖 Bot</h3><p>• Thanks for your message!<br>• I am ready to help you.</p>";

    document.getElementById("msg").value = "";
}

function voice() {
    alert("🎤 Voice message option");
}

function file() {
    alert("📎 File option");
}
</script>

</body>
</html>
