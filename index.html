```html
<!DOCTYPE html>
<html>
<head>
<title>My Chatbot</title>

<style>
body{font-family:Arial;background:#f2f2f2}
.chat{width:90%;max-width:600px;margin:30px auto;background:white;
padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
h1{text-align:center}
#messages{height:400px;overflow:auto;padding:10px}
.input{display:flex;gap:5px;border-top:1px solid #ddd;padding-top:10px}
input{flex:1;padding:12px;border:1px solid #aaa;border-radius:5px}
button{padding:10px;border:0;border-radius:5px;cursor:pointer}
.send{background:#333;color:white}
</style>
</head>

<body>

<div class="chat">
<h1>🤖 My Chatbot</h1>

<div id="messages">
<h3>Welcome!</h3>
<p>• Ask me anything.<br>• I will answer in <b>key points</b>.</p>
</div>

<div class="input">
<button onclick="voice()">🎤</button>
<button onclick="file()">📎</button>
<input id="msg" placeholder="Type your message..."
onkeydown="if(event.key=='Enter')send()">
<button class="send" onclick="send()">Send</button>
</div>
</div>

<script>

function send(){
let q=document.getElementById("msg").value.toLowerCase();
if(!q)return;

let answer;

if(q.includes("hello")||q.includes("hi"))
answer="<b>Hello!</b><br>• Nice to meet you.<br>• How can I help you?";

else if(q.includes("your name"))
answer="<b>My Name</b><br>• I am <b>My Chatbot</b>.<br>• I am here to help you.";

else if(q.includes("python"))
answer="<b>Python</b><br>• Python is a programming language.<br>• It is easy to learn.<br>• It is used for AI, websites and data.";

else if(q.includes("html"))
answer="<b>HTML</b><br>• HTML creates the structure of a webpage.<br>• It uses tags.<br>• It works with CSS and JavaScript.";

else if(q.includes("cpp")||q.includes("c++"))
answer="<b>C++</b><br>• C++ is a programming language.<br>• It is fast and powerful.<br>• It is commonly used for software and games.";

else if(q.includes("thank"))
answer="<b>You’re Welcome! 😊</b><br>• I am always happy to help.";

else
answer="<b>Answer</b><br>• I understood your question.<br>• I will try to help you with the best possible information.";

document.getElementById("messages").innerHTML+=
"<h3>You</h3><p>• "+q+"</p>"+
"<h3>🤖 Bot</h3><p>"+answer+"</p>";

document.getElementById("msg").value="";
}

function voice(){
alert("🎤 Voice message option");
}

function file(){
alert("📎 File option");
}

</script>

</body>
</html>
```
